services:
  angular-app:
    build:
      context: .
      args:
        CONTAINER_PORT: ${CONTAINER_PORT:-80}
    image: ${IMAGE_NAME:-crm}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-crm}
    ports:
      - "${HOST_PORT:-8089}:${CONTAINER_PORT:-80}"
    environment:
      PORT: ${CONTAINER_PORT:-80}
      BACKEND_URL: ${BACKEND_URL:-http://${BACKEND_HOST:-backend}:${BACKEND_PORT:-3000}${BACKEND_PATH:-}}
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - crm-network

networks:
  crm-network:
    name: ${DOCKER_NETWORK:-crm-network}
    external: true
