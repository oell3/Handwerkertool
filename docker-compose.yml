services:
  angular-app:
    build: .
    container_name: crm
    ports:
      - "8085:80"
    environment:
      - PORT=80
      - BACKEND_URL=http://backend:3000   # ← Service-Name des externen Backends
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    external: true   # ← existierendes Netzwerk, in dem auch das Backend läuft